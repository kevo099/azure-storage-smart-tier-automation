name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show PowerShell version (runner ships 7.4 LTS; the runbook targets the PowerShell 7.4 runtime)
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Parse PowerShell and check safety markers
        shell: pwsh
        run: ./tests/StaticValidation.ps1

      - name: Behavioural harness against the real runbook (mocked Az cmdlets)
        shell: bash
        run: pwsh -NonInteractive -NoProfile -File ./tests/BehaviorHarness.ps1 < /dev/null

      - name: PSScriptAnalyzer (errors and warnings fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          $findings = Invoke-ScriptAnalyzer -Path ./src/Enable-AzStorageSmartTier.ps1 -Severity Error,Warning
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if (@($findings).Count -gt 0) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }

      - name: Validate RBAC JSON templates
        shell: bash
        run: |
          jq empty infra/rbac/*.json
          jq -e '.Actions == ["Microsoft.Resources/subscriptions/read","Microsoft.Resources/subscriptions/resourceGroups/read","Microsoft.Storage/storageAccounts/read"] and .NotActions == []' infra/rbac/discovery-reader-role.template.json > /dev/null
          jq -e '.Actions == ["Microsoft.Storage/storageAccounts/read","Microsoft.Storage/storageAccounts/write"] and .NotActions == []' infra/rbac/storage-remediator-role.template.json > /dev/null

      - name: Compile Bicep templates
        shell: bash
        run: |
          az bicep build --file infra/test-environment.bicep --stdout > /dev/null
          az bicep build --file infra/automation-account.bicep --stdout > /dev/null

      - name: Shell scripts parse
        shell: bash
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Ring-role revocation regression (mocked Azure CLI, no Azure access)
        run: python3 tests/RingRoleHarness.py
